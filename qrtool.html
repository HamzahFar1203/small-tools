                    <h2>QR Gen.</h2>

                    <form>
                        <input type="url" name="urlInput" id="userInput" placeholder="Insert link here..." required>
                    </form>

                    <button type="submit" id="submitBtn">Convert</button>

                    <div id="output_field"></div>

                    <p style="margin-top: 1em;">The purpose of this tool is to convert any URL you desire into a QR code for ease of use. You can use this tool to generate QR codes for promotionals, advertisements, event planning, etc. </p>
