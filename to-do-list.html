<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>To Do List</title>
		<meta name="description" content="A basic to do list app developed using HTML, CSS, and JavaScript">
		<meta name="author" content="Hamzah Farooqui">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

		<link rel="stylesheet" href="datasrc/css/to-do-list-style.css">
		<link rel="stylesheet" href="datasrc/css/page-defaults.css">
	</head>
	<body>

		<main>

			<article id="wrapper">

				<header id="header">
					<a href="./index.html">
						<svg xmlns="http://www.w3.org/2000/svg" class="logo" height="25" fill="currentColor" viewBox="0 0 16 16">
							<path fill-rule="evenodd" d="M15.528 2.973a.75.75 0 0 1 .472.696v8.662a.75.75 0 0 1-.472.696l-7.25 2.9a.75.75 0 0 1-.557 0l-7.25-2.9A.75.75 0 0 1 0 12.331V3.669a.75.75 0 0 1 .471-.696L7.443.184l.01-.003.268-.108a.75.75 0 0 1 .558 0l.269.108.01.003 6.97 2.789ZM10.404 2 4.25 4.461 1.846 3.5 1 3.839v.4l6.5 2.6v7.922l.5.2.5-.2V6.84l6.5-2.6v-.4l-.846-.339L8 5.961 5.596 5l6.154-2.461z"/>
						</svg>
					</a>
				</header>
				
				<section id="title">
					<h1>To-Do List</h1>

					<p>ENTER YOUR TASKS</p>
				</section>

				<!-- 
					List Items will be outputted here.
				-->
				<section id="list"></section>

				<!--
					User Input is gathered through a text input, and sent to the JavaScript
					by the press of the submit input.
				-->
				<form id="input-bar">
					<input type="text" name="task" id="input_field" />
					<input type="button" name="submit" id="submit_button" value="↥"/>
				</form>

				<footer id="footer">
					<svg xmlns="http://www.w3.org/2000/svg" class="logo" width="16" height="16" fill="grey" viewBox="0 0 16 16">
						<path fill-rule="evenodd" d="M15.528 2.973a.75.75 0 0 1 .472.696v8.662a.75.75 0 0 1-.472.696l-7.25 2.9a.75.75 0 0 1-.557 0l-7.25-2.9A.75.75 0 0 1 0 12.331V3.669a.75.75 0 0 1 .471-.696L7.443.184l.01-.003.268-.108a.75.75 0 0 1 .558 0l.269.108.01.003 6.97 2.789ZM10.404 2 4.25 4.461 1.846 3.5 1 3.839v.4l6.5 2.6v7.922l.5.2.5-.2V6.84l6.5-2.6v-.4l-.846-.339L8 5.961 5.596 5l6.154-2.461z"/>
					</svg>
					<span>| Hamzah Farooqui</span>
				</footer>

			</article>

		</main>

		<script src="datasrc/js/to-do-list.js"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <script>
            $("body").hide().slideDown(800);
        </script>
	</body>
</html>
